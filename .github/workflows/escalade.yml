name: Escalade (mercredi 16h08)

on:
  schedule:
    # 14:08 UTC = 16:08 Paris en été. En hiver (CET) : "8 15 * * 3".
    - cron: "8 14 * * 3"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Envoyer Escalade
        env:
          SLACK_WEBHOOK_ESCALADE: ${{ secrets.SLACK_WEBHOOK_ESCALADE }}
        run: node scripts/send.js --activity escalade
