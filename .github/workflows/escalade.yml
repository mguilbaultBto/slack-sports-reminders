name: Escalade (mercredi 17h)

on:
  schedule:
    # Mercredi seulement. 15:00 UTC = 17h Paris en été, 16:00 UTC = 17h en hiver.
    - cron: "0 15,16 * * 3"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Envoyer Escalade
        env:
          SLACK_WEBHOOK_ESCALADE: ${{ secrets.SLACK_WEBHOOK_ESCALADE }}
        run: node scripts/send.js --activity escalade
