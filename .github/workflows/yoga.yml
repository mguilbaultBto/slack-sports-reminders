name: Yoga (lundi 11h08)

on:
  schedule:
    # 09:08 UTC = 11:08 Paris en été (test du retard GitHub).
    - cron: "8 9 * * 1"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Envoyer Yoga
        env:
          SLACK_WEBHOOK_YOGA: ${{ secrets.SLACK_WEBHOOK_YOGA }}
        run: node scripts/send.js --activity yoga
